services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: swiftpay
      MYSQL_USER: swiftpay
      MYSQL_PASSWORD: swiftpay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uswiftpay", "-pswiftpay"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/swiftpay?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: swiftpay
      SPRING_DATASOURCE_PASSWORD: swiftpay
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  loadtest:
    image: grafana/k6:0.55.2
    depends_on:
      app:
        condition: service_started
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./scripts:/scripts:ro
    command:
      - run
      - /scripts/load-test.js
    profiles:
      - loadtest

  capture:
    image: nicolaka/netshoot:latest
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./artifacts/pcap:/captures
    command:
      - sh
      - -lc
      - tcpdump -i any -s 0 -U -w /captures/load-test.pcap 'tcp port 8080 or tcp port 3306 or tcp port 6379 or tcp port 9092'
    profiles:
      - capture

volumes:
  mysql-data:
